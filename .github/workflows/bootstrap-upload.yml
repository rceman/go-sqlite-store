name: bootstrap-upload

on:
  push:
    branches: [main]
    paths: ['.github/workflows/bootstrap-upload.yml']

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Materialize source tree
        shell: bash
        run: |
          cat > /tmp/src.tgz.b64 <<'EOF'
          
          EOF
          base64 -d /tmp/src.tgz.b64 > /tmp/src.tgz
          tar -xzf /tmp/src.tgz -C .
          rm -f .github/workflows/bootstrap-upload.yml
      - name: Commit source tree
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: initial high-performance SQLite store foundation'
          git push origin HEAD:main
