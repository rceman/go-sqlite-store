name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Install SQLite development package
        run: sudo apt-get update && sudo apt-get install -y pkg-config libsqlite3-dev
      - name: Format check
        run: test -z "$(gofmt -l .)"
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Race
        run: go test -race ./...
      - name: Build daemon
        run: go build ./cmd/sqlite-stored
