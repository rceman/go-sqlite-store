name: integration-benchmark

on:
  push:
    branches: [feature/integration-ready]

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Install SQLite development package
        run: sudo apt-get update && sudo apt-get install -y pkg-config libsqlite3-dev
      - name: Embedded vs Unix socket
        run: go test ./benchmarks -run '^$' -bench 'BenchmarkMixed(Embedded|UnixSocket)$' -benchmem -benchtime=5s -count=3
