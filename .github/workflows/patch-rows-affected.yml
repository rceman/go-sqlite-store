name: patch-rows-affected

on:
  push:
    branches: [feature/integration-ready]
    paths: ['.github/workflows/patch-rows-affected.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Install SQLite development package
        run: sudo apt-get update && sudo apt-get install -y pkg-config libsqlite3-dev
      - name: Patch store atomically
        shell: python
        run: |
          from pathlib import Path
          p = Path('store/store.go')
          s = p.read_text()
          old = '''\t\tif st.SQL == "" {\n\t\t\treturn nil, fmt.Errorf("statement %d has empty SQL", i)\n\t\t}\n\t\tcopyStmts[i] = Statement{SQL: st.SQL, Args: append([]any(nil), st.Args...)}'''
          new = '''\t\tif st.SQL == "" {\n\t\t\treturn nil, fmt.Errorf("statement %d has empty SQL", i)\n\t\t}\n\t\tif st.RequireRowsAffected < 0 {\n\t\t\treturn nil, fmt.Errorf("statement %d require_rows_affected must not be negative", i)\n\t\t}\n\t\tcopyStmts[i] = Statement{\n\t\t\tSQL: st.SQL, Args: append([]any(nil), st.Args...),\n\t\t\tRequireRowsAffected: st.RequireRowsAffected,\n\t\t}'''
          assert old in s, 'batch copy snippet not found'
          s = s.replace(old, new, 1)
          old = '''\t\tfor _, st := range req.stmts {\n\t\t\tr, err := conn.ExecUser(st.SQL, st.Args...)\n\t\t\tif err != nil {\n\t\t\t\treqErr = err\n\t\t\t\tbreak\n\t\t\t}\n\t\t\tresults = append(results, r)\n\t\t}'''
          new = '''\t\tfor statementIndex, st := range req.stmts {\n\t\t\tr, err := conn.ExecUser(st.SQL, st.Args...)\n\t\t\tif err != nil {\n\t\t\t\treqErr = err\n\t\t\t\tbreak\n\t\t\t}\n\t\t\tif st.RequireRowsAffected > 0 && r.RowsAffected != st.RequireRowsAffected {\n\t\t\t\treqErr = &RowsAffectedMismatchError{\n\t\t\t\t\tStatement: statementIndex,\n\t\t\t\t\tRequired: st.RequireRowsAffected,\n\t\t\t\t\tActual: r.RowsAffected,\n\t\t\t\t}\n\t\t\t\tbreak\n\t\t\t}\n\t\t\tresults = append(results, r)\n\t\t}'''
          assert old in s, 'execute snippet not found'
          s = s.replace(old, new, 1)
          p.write_text(s)
      - name: Verify
        run: |
          gofmt -w store/store.go
          go test ./store
          go vet ./store
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add store/store.go
          git commit -m 'feat: rollback batch request on rows-affected mismatch'
          git push origin HEAD:feature/integration-ready
